server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/vidya_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
jwt:
  secret: ${JWT_SECRET:VidyaVedikaDevSecretKeyForJwtMustBeAtLeast32Chars!}
  expiry-ms: ${JWT_EXPIRY_MS:3600000}
