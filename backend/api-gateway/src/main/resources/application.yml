server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: [GET,POST,PUT,DELETE,OPTIONS]
            allowedHeaders: "*"
      routes:
        - {id: auth-service, uri: ${AUTH_SERVICE_URL:http://localhost:8081}, predicates: [Path=/api/auth/**]}
        - {id: user-service, uri: ${USER_SERVICE_URL:http://localhost:8082}, predicates: [Path=/api/users/**]}
        - {id: language-service, uri: ${LANGUAGE_SERVICE_URL:http://localhost:8083}, predicates: [Path=/api/languages/**]}
        - {id: learning-service, uri: ${LEARNING_SERVICE_URL:http://localhost:8084}, predicates: [Path=/api/learning/**]}
        - {id: ai-practice-service, uri: ${AI_SERVICE_URL:http://localhost:8085}, predicates: [Path=/api/ai/**]}
        - {id: mock-interview-service, uri: ${INTERVIEW_SERVICE_URL:http://localhost:8086}, predicates: [Path=/api/interviews/**]}
        - {id: payment-service, uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}, predicates: [Path=/api/payments/**]}
        - {id: notification-service, uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}, predicates: [Path=/api/notifications/**]}
        - {id: admin-service, uri: ${ADMIN_SERVICE_URL:http://localhost:8089}, predicates: [Path=/api/admin/**]}
management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:VidyaVedikaDevSecretKeyForJwtMustBeAtLeast32Chars!}
